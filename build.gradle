plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.1.20'
    id 'io.freefair.lombok' version "9.2.0"
}

version = mod_version
group = maven_group

configurations {
    libraries
    api.extendsFrom libraries

    // dev-only dependencies: on this project's classpaths, never published, so downstream
    // consumers do not have to add the matching repositories to resolve our pom
    localImplementation
    runtimeClasspath.extendsFrom localImplementation
    compileOnly.extendsFrom localImplementation

    // the runtime-only flavour of the above: present when we run the game, absent from
    // the compile classpath and from the published metadata
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

// allprojects, not project-local: the add-on modules under module.* resolve LDLib2's own
// transitives (kotlin-stdlib, taffy) and would otherwise each need this list copied.
allprojects {
    repositories {
        // the Forge/Minecraft mirrors are asked before mavenCentral(), and a 5xx from one fails the build instead of
        // falling through, so test-only libraries skip them
        exclusiveContent {
            forRepository { mavenCentral() }
            filter {
                includeGroupByRegex 'org\\.junit(\\..*)?'
                includeGroup 'org.mockito'
                includeGroup 'org.opentest4j'
                includeGroup 'org.apiguardian'
                includeGroup 'net.bytebuddy'
                includeGroup 'org.objenesis'
            }
        }
        mavenCentral()
        mavenLocal()
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        } // Modrinth File
        maven {
            name = "CurseForge"
            url = "https://cursemaven.com"
        } // CurseForge
        maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
        maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
        maven { // Flywheel
            url = "https://maven.tterrag.com/"
            content {
                // need to be specific here due to version overlaps
                includeGroup("com.jozufozu.flywheel")
            }
        }
        // mavens for Forge-exclusives
        maven { url = "https://maven.theillusivec4.top/" } // Curios
        maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu, EMI
        maven { // Create Forge and Registrate Forge
            url = "https://maven.tterrag.com/"
            content {
                includeGroup("com.tterrag.registrate")
                includeGroup("com.simibubi.create")
            }
        }
        maven { url = "https://jitpack.io/" } // Mixin Extras, Fabric ASM
        maven {
            // saps.dev Maven (KubeJS and Rhino)
            url "https://maven.latvian.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
                includeGroup "dev.latvian.apps"
            }
        }
        maven { // Architectury (needed by KubeJS at runtime)
            url "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }
    }
}

base {
    archivesName = "${project.name}-${minecraft_version}"
}

// Minecraft 1.20.1 runs on Java 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

kotlin {
    jvmToolchain(17)
    compilerOptions {
        freeCompilerArgs.add("-Xcontext-parameters")
        freeCompilerArgs.add("-Xwhen-guards")
    }
}

legacyForge {
    // Setting the version is what enables the plugin; the configurations used below only exist after it.
    version = "${minecraft_version}-${forge_version}"

    accessTransformers.from rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

    addModdingDependenciesTo sourceSets.test

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach { run ->
            // One game directory per run (runs/<name>): the parallel and multi-process harnesses rely on
            // every run having its own saves, logs and options.
            run.gameDirectory = project.file("runs/${run.name}")

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            run.systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            run.logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            // -PldSyncBench runs the sync benchmark (test/syncdata/bench) along with the gametests
            systemProperty 'ldlib2.syncBench', project.hasProperty('ldSyncBench').toString()
        }

        data {
            data()
            // example of overriding the gameDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Non-mod libraries (kotlin-stdlib, taffy) go on the game's legacy classpath in dev runs.
configurations.additionalRuntimeClasspath.extendsFrom configurations.libraries

// Mods on maven are published in SRG names and have to be remapped to the dev mappings. MDG provides
// modImplementation / modCompileOnly / modRuntimeOnly / modApi; these add modLocalImplementation / modLocalRuntime.
obfuscation {
    createRemappingConfiguration(configurations.localImplementation)
    createRemappingConfiguration(configurations.localRuntime)
}

// Forge 1.20.1 does not read [[mixins]] from mods.toml: mixin configs are listed in the jar manifest,
// and production needs the refmap generated here.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('jar', Jar) {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

// In-client UI test harness: -PldTest wiring plus the verifyUiTest gate.
// Kept in its own file so downstream mods can apply the identical block.
apply from: rootProject.file('gradle/ldlib2-uitest.gradle')

// Parallel UI test harness: runParTest splits the same scenarios across N client processes.
apply from: rootProject.file('gradle/ldlib2-uitest-par.gradle')

// Multi-process test harness: runMpTest orchestrates a dedicated server + N clients.
apply from: rootProject.file('gradle/ldlib2-mptest.gradle')

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.kotlin { srcDir("src/main/java") }

dependencies {
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge') {
        version {
            require "[0.4.1,)"
            prefer "0.4.1"
        }
    }

    libraries("org.jetbrains.kotlin:kotlin-stdlib:${kotlin_stdlib_version}") {
        exclude group: "org.jetbrains", module: "annotations"
    }
    // a bare range embeds the newest release, pre-releases included; prefer pins what the jar ships
    jarJar(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib') {
        version {
            require "[${kotlin_stdlib_version},)"
            prefer kotlin_stdlib_version
        }
    }

    // JEI
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}") { transitive = false }
    // only the api is on the compile classpath, the full mod is runtime only.
    // localRuntime rather than runtimeOnly: runtimeOnly is published, and that would make
    // every downstream mod declare JEI's maven just to resolve us
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false }

    modLocalRuntime("curse.maven:mezzconfig-1689768:9527933")

    // REI
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1")

    // EMI
    modCompileOnly("maven.modrinth:emi:${emi_version}")
    if (project.hasProperty('withEmi')) {
        modLocalRuntime("maven.modrinth:emi:${emi_version}")
    }

    // AE2
    modLocalImplementation("appeng:appliedenergistics2-forge:${ae2_version}") { transitive = false }
    modLocalRuntime("curse.maven:guideme-1173950:8204776")

    // KJS: remapped dependencies do not bring their transitives, so Rhino and Architectury are listed too
    modLocalImplementation("dev.latvian.mods:kubejs-forge:${kjs_version}") { transitive = false }
    modLocalImplementation("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
    modLocalImplementation("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }

    // Oculus / Embeddium: the Forge 1.20.1 ports of Iris / Sodium
    if (!project.hasProperty('server')) { // client only so shouldnt be on a server run
        modLocalImplementation("maven.modrinth:embeddium:${embeddium_version}")
        modLocalImplementation("maven.modrinth:oculus:${oculus_version}")
    } else {
        modCompileOnly("maven.modrinth:embeddium:${embeddium_version}")
        modCompileOnly("maven.modrinth:oculus:${oculus_version}")
    }

    // lombok
//    compileOnly 'org.projectlombok:lombok:1.18.30'
//    annotationProcessor 'org.projectlombok:lombok:1.18.30'


    // Taffy
    libraries("dev.vfyjxf:taffy:${taffy_version}")
    jarJar(group: 'dev.vfyjxf', name: 'taffy') {
        version {
            require "[${taffy_version},)"
            prefer taffy_version
        }
    }

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'

    // mock
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
}

tasks.withType(ProcessResources).configureEach {
    // set up properties for filling into metadata
    var replaceProperties = [
            "mod_id": mod_id,
            "version": version,
            "loader_version": loader_version,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "jei_version_range": jei_version_range,
            "mod_license": mod_license,
            "mod_name": mod_name,
            "mod_description": mod_description,
            "mod_url": mod_url
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

// Configure the 'jarJar' task
// Its output is packed into the 'jar' task, which MDG then reobfuscates (reobfJar) for release
tasks.named('jarJar') {
    // ...
}

tasks.register("printVersion") {
    println(mod_version)
}

configurations.matching { it.name == 'reobfApiElements' }.configureEach { extendsFrom configurations.api }
configurations.matching { it.name == 'reobfRuntimeElements' }.configureEach {
    extendsFrom configurations.api, configurations.implementation, configurations.runtimeOnly
}

// Example configuration to allow publishing using the maven-publish plugin
// (MDG swaps the reobfuscated jar into the java component, so this publishes SRG-named jars)
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        maven {
            name "Expandium"
            url "https://repo.expandium.net/${version.toString().toLowerCase().contains('snapshot') ? 'snapshots' : 'releases'}"
            credentials {
                username System.getenv("MAVEN_USER")
                password System.getenv("MAVEN_PASS")
            }
        }
    }
}
